# Example output of Prompt 1: the resources file you import into the app's course creator.
# Resources are grouped by type; `topics` on each one tells the course builder what it covers.

version: 1
subject: "Kubernetes fundamentals"
learner: "Knows Linux and Docker, never used Kubernetes"
goal: "Run, expose, configure and debug apps on a local cluster"
environment: "kind on local Docker, kubectl"

topics:
  - id: what-is-k8s
    title: "What Kubernetes is and its architecture"
    level: beginner
  - id: local-cluster
    title: "Local cluster with kind and kubectl"
    level: beginner
  - id: pods
    title: "Pods and their lifecycle"
    level: beginner
  - id: deployments
    title: "Deployments, rollouts and rollbacks"
    level: beginner
  - id: troubleshooting
    title: "Troubleshooting workloads"
    level: intermediate
  - id: services
    title: "Services and Ingress"
    level: beginner
  - id: config
    title: "ConfigMaps and Secrets"
    level: beginner

resources:
  videos:
    - id: nana-k8s-full-course
      title: "Kubernetes Tutorial for Beginners [FULL COURSE in 4 Hours]"
      url: https://www.youtube.com/watch?v=X48VuDVv0do
      author: "TechWorld with Nana"
      minutes: 240
      level: beginner
      topics: [what-is-k8s, pods, deployments, services, config]
      why: "Clear visual walkthrough of the architecture and every core object."

  playlists: []

  articles:
    - id: iximiuz-container-path
      title: "Learning Containers From The Bottom Up"
      url: https://iximiuz.com/en/posts/container-learning-path/
      author: "Ivan Velichko"
      minutes: 20
      level: beginner
      topics: [what-is-k8s]
      why: "Fills gaps in container basics before Kubernetes."

